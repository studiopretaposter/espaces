:root{--vio:#833AB4;--pink:#FD1D78;--ora:#FF963C;--ink:#22182F;--grey:#6B6178;--soft:#FBF5F9;--line:#EFE4EC;--ok:#1E9E62;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.hero{background:var(--grad);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 28px 28px;margin:0 -16px 8px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-80px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.12em}
.brand img{width:30px;height:30px}
.hero h1{font-size:30px;line-height:1.1;font-weight:900;letter-spacing:-.02em;margin:18px 0 6px}
.hero p{margin:0;opacity:.92;font-size:15px}
h2{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:24px 4px 10px}
.sub{color:var(--grey);margin:-4px 4px 14px;font-size:15px}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 24px rgba(34,24,47,.07);margin-bottom:16px;overflow:hidden;border:1px solid var(--line)}
.pad{padding:18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--soft);border-radius:14px;padding:12px}
.kv b{display:block;font-size:22px;font-weight:900}
.kv span{font-size:13px;color:var(--grey)}
.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:30px;background:var(--soft);color:var(--vio);white-space:nowrap}
.pill.reel{background:#FFE6F0;color:#C2125A}.pill.story{background:#F1E7FA;color:var(--vio)}.pill.carrousel,.pill.post{background:#FFF0E2;color:#B85A0F}
.progress{display:flex;align-items:center;gap:10px;margin-top:14px}
.bar{flex:1;height:10px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .4s}
.progress b{font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:30px;padding:9px 15px;font:700 14px Inter;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button.now:after{content:' •';color:var(--pink)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;gap:10px}
.day{font-size:19px;font-weight:900;letter-spacing:-.01em}
.title{padding:0 18px 12px;color:var(--grey);font-size:15px}
.media{display:flex;gap:10px;overflow-x:auto;padding:0 18px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.media::-webkit-scrollbar{display:none}
.media img,.media video{flex:none;height:320px;border-radius:14px;scroll-snap-align:start;background:#eee;object-fit:cover;max-width:86%}
.media.one img,.media.one video{width:100%;max-width:100%;height:auto;max-height:560px;object-fit:contain;background:var(--soft)}
.swipe{font-size:13px;color:var(--grey);padding:0 18px 8px}
.seq{margin:0 18px 12px;padding:0 0 0 22px}.seq li{margin-bottom:8px;font-size:15px}.seq span{color:var(--grey)}
.tip{margin:4px 18px 12px;background:#FFF6E8;border-radius:12px;padding:10px 12px;font-size:15px}
.cap{margin:0 18px 12px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:15px;white-space:pre-wrap;max-height:5.8em;overflow:hidden;position:relative;cursor:pointer}
.cap.open{max-height:none}
.cap:not(.open):after{content:'Voir tout le texte ▾';position:absolute;left:0;right:0;bottom:0;padding:18px 12px 6px;background:linear-gradient(transparent,#fff 60%);font-weight:700;color:var(--vio);font-size:14px}
.steps{padding:4px 18px 16px;display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:15px 16px;font:800 16px Inter;cursor:pointer;color:#fff;background:var(--grad);text-decoration:none}
.btn .n{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:14px}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}
.check{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);font-weight:700;cursor:pointer;user-select:none}
.check input{width:24px;height:24px;accent-color:var(--ok)}
.card.done .seq,.card.done .media,.card.done .cap,.card.done .tip,.card.done .steps,.card.done .swipe{display:none}
.card.done .check{color:var(--ok)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.list .ico{flex:none;width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.mini{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.mini img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none}
.mini b{display:block;font-size:15px}.mini span{font-size:13px;color:var(--grey)}
.covers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px 12px}
.covers figure{margin:0;text-align:center;font-size:12px;color:var(--grey)}
.covers img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2px var(--pink)}
.pp{display:flex;gap:16px;align-items:center;padding:18px}
.pp img{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--pink);flex:none}
details{border-top:1px solid var(--line)}
details:first-child{border:0}
summary{list-style:none;padding:16px 18px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary:after{content:'+';font-size:22px;color:var(--vio)}
details[open] summary:after{content:'–'}
details .in{padding:0 18px 16px;color:#3b3147}
details ol{padding-left:20px;margin:0}details li{margin-bottom:8px}
.sw{display:inline-block;width:26px;height:26px;border-radius:8px;vertical-align:middle;margin-right:10px;border:1px solid var(--line)}
.kitacc details{border-top:1px solid var(--line)}.kitacc details:first-child{border-top:0}
.kitacc summary{list-style:none;cursor:pointer;padding:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.kitacc summary::-webkit-details-marker{display:none}.kitacc summary:after{content:'+';margin-left:auto;font-size:20px;color:var(--pink)}
.kitacc details[open] summary:after{content:'–'}
.kitacc .row{padding:0 16px 14px}.kitacc .row+.row{border-top:1px dashed var(--line);padding-top:14px}
.kitacc .row b{display:block;margin-bottom:6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:140px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}

.nav button i{font-style:normal;font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.55}
.nav button.on{color:var(--pink)}.nav button.on i{filter:none;opacity:1}
.view{display:none}.view.on{display:block}
.toast{opacity:0;pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;font-weight:700;transition:.3s;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;inset:0;background:rgba(34,24,47,.5);display:none;align-items:flex-end;z-index:8}
.sheet.show{display:flex}
.sheet>div{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:20px;font-weight:900}
.sheet ol{padding-left:20px;margin:0 0 16px}.sheet li{margin-bottom:8px}
.foot{text-align:center;font-size:13px;color:var(--grey);margin:26px 0 8px}
a{color:var(--vio)}
</style>
</head>

async function preload(it) {
  if (!it.media.length) return null;
  if (!files[it.id]) files[it.id] = Promise.all(it.media.map(async (m, k) => { const r = await fetch(m.file); const b = await r.blob(); return new File([b], `${C.slug}-${it.id}-${k + 1}.${m.file.split('.').pop()}`, { type: b.type }); })).catch(() => null);
  return files[it.id];
}
async function share(it) {
  const fl = await preload(it);
  if (fl && navigator.canShare && navigator.canShare({ files: fl })) {
    try { await navigator.share({ files: fl }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  sheet(t('Enregistrer dans tes photos', 'Enregistrer dans vos photos'), [t('Appuie longuement sur l\'image (ou la vidéo).', 'Appuyez longuement sur l\'image (ou la vidéo).'), t('Choisis « Enregistrer dans Photos ».', 'Choisissez « Enregistrer dans Photos ».'), t('Ouvre Instagram, appuie sur + et sélectionne-la.', 'Ouvrez Instagram, appuyez sur + et sélectionnez-la.')]);

  [t('Mettre ton espace sur l\'écran d\'accueil', 'Mettre votre espace sur l\'écran d\'accueil'), [t('iPhone : dans Safari, appuie sur Partager ⬆️ puis « Sur l\'écran d\'accueil ».', 'iPhone : dans Safari, appuyez sur Partager ⬆️ puis « Sur l\'écran d\'accueil ».'), t('Android : dans Chrome, menu ⋮ puis « Ajouter à l\'écran d\'accueil ».', 'Android : dans Chrome, menu ⋮ puis « Ajouter à l\'écran d\'accueil ».'), t('Ton espace s\'ouvre ensuite comme une application.', 'Votre espace s\'ouvre ensuite comme une application.')]],
  [t('Instagram n\'apparaît pas tout de suite ?', 'Instagram n\'apparaît pas tout de suite ?'), [t('Dans la ligne des applis, fais défiler vers la gauche jusqu\'à Instagram.', 'Dans la ligne des applis, faites défiler vers la gauche jusqu\'à Instagram.'), t('Pour l\'avoir toujours en premier : au bout de la ligne, appuie sur « Plus » › « Modifier », puis ajoute Instagram aux favoris.', 'Pour l\'avoir toujours en premier : au bout de la ligne, appuyez sur « Plus » › « Modifier », puis ajoutez Instagram aux favoris.')]],
  ['Le bouton « Envoyer » ne marche pas ?', [t('Ouvre ton espace dans Safari (iPhone) ou Chrome (Android), pas directement dans WhatsApp.', 'Ouvrez votre espace dans Safari (iPhone) ou Chrome (Android), pas directement dans WhatsApp.'), t('Sinon : appuie longuement sur l\'image › « Enregistrer dans Photos », puis publie depuis Instagram.', 'Sinon : appuyez longuement sur l\'image › « Enregistrer dans Photos », puis publiez depuis Instagram.')]]];
$('#guides').innerHTML = G.map(([q, s]) => `<details><summary>${q}</summary><div class="in"><ol>${s.map(x => `<li>${x}</li>`).join('')}</ol></div></details>`).join('');
$('#cadre').innerHTML = (P.cadre || []).map(([q, s]) => `<details><summary>${esc(q)}</summary><div class="in"><ul style="padding-left:18px;margin:0">${s.map(x => `<li style="margin-bottom:6px">${esc(x)}</li>`).join('')}</ul></div></details>`).join('');
const CT = DATA.contact || {};
$('#contact').innerHTML = `<p style="margin:0 0 14px">${esc(CT.text || '')}</p>${CT.email ? `<a class="btn" href="mailto:${CT.email}?subject=${encodeURIComponent('Mon espace ' + C.name)}">✉️ Écrire un e-mail</a><p style="text-align:center;font-size:14px;color:var(--grey);margin:8px 0 0">${CT.email}</p>` : ''}`;

(DATA.extras || []).forEach((x, xi) => {
  const w = document.createElement('div');
  w.innerHTML = `<h2>${esc(x.title)}</h2>${x.intro ? `<p class="sub">${esc(x.intro)}</p>` : ''}<div class="card">${x.rows.map((r, k) => `<div class="pad" style="${k ? 'border-top:1px solid var(--line)' : ''}"><b>${esc(r.label)}</b>${r.text ? `<div class="cap open" style="margin:8px 0 ${r.copy ? 10 : 0}px;cursor:default">${esc(r.text)}</div>` : ''}${r.copy ? `<button class="btn dark" data-x="${xi}_${k}">Copier</button>` : ''}</div>`).join('')}</div>`;
  $('#extras').appendChild(w);
});
document.querySelectorAll('[data-x]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText((([a, c]) => DATA.extras[a].rows[c].text)(b.dataset.x.split('_'))); b.classList.replace('dark', 'ok'); b.textContent = 'Copié ✓'; } catch (e) { toast('Appuie longuement sur le texte pour le copier'); } });

const K = DATA.kit;
if (K) {
  $('#navKit').style.display = '';
  $('#kitT').textContent = K.title || 'Mon kit';
  $('#kitSub').textContent = K.intro || '';
  const cv = K.canva || [];
  if (cv.length) {
    $('#kitCanva').innerHTML = `<div class="card"><div class="pad"><b>${esc(K.canva_title || 'Mes modèles Canva')}</b><p style="margin:6px 0 12px;color:var(--grey);font-size:14px">${esc(K.canva_intro || '')}</p><div class="btnrow">${cv.map(c => c.url ? `<a class="btn" href="${c.url}" target="_blank" rel="noopener">${esc(c.label)}</a>` : `<span class="btn dark" style="opacity:.55">${esc(c.label)} · bientôt</span>`).join('')}</div></div></div>`;
  }
  $('#kitBody').innerHTML = `<div class="card kitacc">${K.blocks.map((b, bi) => `<details${bi === 0 ? ' open' : ''}><summary><span>${b.icon || ''}</span>${esc(b.title)}</summary>${b.intro ? `<p class="sub" style="padding:0 16px;margin:0 0 10px">${esc(b.intro)}</p>` : ''}${b.rows.map((r, k) => `<div class="row">${/^#[0-9A-Fa-f]{6}$/.test(r.text) ? `<span class="sw" style="background:${r.text}"></span>` : ''}<b style="display:inline">${esc(r.label)}</b>${r.text ? `<div class="cap open" style="margin:8px 0 ${r.copy ? 10 : 0}px;cursor:default">${esc(r.text)}</div>` : ''}${r.copy ? `<button class="btn dark" data-k="${bi}_${k}">Copier</button>` : ''}</div>`).join('')}</details>`).join('')}</div>`;
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => { const [a, c] = b.dataset.k.split('_'); try { await navigator.clipboard.writeText(K.blocks[a].rows[c].text); b.classList.replace('dark', 'ok'); b.textContent = 'Copié ✓'; } catch (e) { toast('Appuie longuement sur le texte pour le copier'); } });
}
function go(v) { document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v)); document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); window.scrollTo(0, 0); try { history.replaceState(null, '', '#' + v); } catch (e) {} }
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => go(b.dataset.v));
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (['home', 'pubs', 'profile', 'kit', 'help'].includes(v)) go(v); });
renderWeek(curWeek); renderHome(); progress();
go(['home', 'pubs', 'profile', 'kit', 'help'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home');
</script>
</body>
