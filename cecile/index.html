<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Custom Chic by Cécile · Mes publications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--main:#1f2a44;--accent:#ec8c9e;--bg:#f7f0e5;--card:#fff;--ink:#1f2a44;--soft:#6b6f7d;--ok:#2f8f5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
header{padding:8px 4px 4px}
.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:600}
h1{font-family:'Playfair Display',serif;font-size:32px;line-height:1.1;margin:6px 0 6px}
.hello{color:var(--soft);margin:0 0 14px}
.progress{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
.bar{flex:1;height:10px;background:#e6dccd;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.progress b{font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs button{flex:none;border:2px solid var(--main);background:transparent;color:var(--main);border-radius:30px;padding:9px 16px;font:600 15px Inter;cursor:pointer}
.tabs button.on{background:var(--main);color:#fff}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(31,42,68,.08);margin-bottom:18px;overflow:hidden}
.card.done{opacity:.6}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.day{font-family:'Playfair Display',serif;font-size:22px;font-weight:700}
.type{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:20px;background:var(--accent);color:#fff}
.type.story{background:var(--main)}
.title{padding:0 18px 10px;color:var(--soft);font-size:15px}
.media{display:flex;gap:10px;overflow-x:auto;padding:0 18px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.media img,.media video{flex:none;height:300px;border-radius:14px;scroll-snap-align:start;background:#eee;object-fit:cover}
.media.one img,.media.one video{width:100%;height:auto;max-height:520px;object-fit:contain;background:#f3ede4}
.swipe{font-size:13px;color:var(--soft);padding:0 18px 8px}
.tip{margin:4px 18px 12px;background:#fff6e5;border-radius:12px;padding:10px 12px;font-size:15px}
.cap{margin:0 18px 12px;border:1px dashed #d8cdbd;border-radius:12px;padding:10px 12px;font-size:15px;white-space:pre-wrap;max-height:5.6em;overflow:hidden;position:relative;cursor:pointer}
.cap.open{max-height:none}
.cap:not(.open)::after{content:'Voir toute la légende ▾';position:absolute;left:0;right:0;bottom:0;padding:18px 12px 6px;background:linear-gradient(transparent,#fff 60%);font-weight:600;color:var(--main);font-size:14px}
.steps{padding:4px 18px 18px;display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:16px 18px;font:600 17px Inter;cursor:pointer;text-align:left;color:#fff;background:var(--main)}
.btn .n{flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:15px}
.btn.alt{background:var(--accent)}
.btn.ok{background:var(--ok)}
.btn.ghost{background:transparent;color:var(--main);border:2px solid var(--main)}
.check{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid #eee5d8;font-weight:600;cursor:pointer;user-select:none}
.check input{width:26px;height:26px;accent-color:var(--ok)}
.help{font-size:14px;color:var(--soft);text-align:center;margin-top:24px}
.toast{opacity:0;pointer-events:none;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;transition:transform .3s;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:8}
.sheet.show{display:flex}
.sheet div{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{font-family:'Playfair Display',serif;margin:0 0 10px;font-size:22px}
.sheet ol{padding-left:20px;margin:0 0 16px}.sheet li{margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Prêt à Poster</div>
    <h1 id="h1"></h1>
    <p class="hello" id="hello"></p>
    <div class="progress"><div class="bar"><i id="barfill"></i></div><b id="count"></b></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="list"></main>
  <p class="help" id="help"></p>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)this.classList.remove('show')"><div>
  <h3>Enregistrer les images</h3>
  <ol><li>Appuie longuement sur chaque image ci-dessus.</li><li>Choisis « Ajouter à Photos » (ou « Enregistrer l'image »).</li><li>Ouvre Instagram, appuie sur <b>+</b>, sélectionne tes images dans l'ordre et colle la légende.</li></ol>
  <button class="btn" onclick="document.getElementById('sheet').classList.remove('show')">J'ai compris</button>
</div></div>
<script>
const DATA = {"client": "Custom Chic by Cécile", "hello": "Coucou tata ! Voici tes publications, semaine par semaine. Pour chacune : copie la légende, envoie vers Instagram, et coche quand c'est fait 😊", "weeks": [{"label": "Semaine du 23 nov.", "id": "s48", "items": [{"id": "c26", "day": "Jeudi 26 nov.", "type": "Carrousel", "title": "Rendez-vous au Studio 42 (6 images)", "media": [{"file": "media/f3ac35f5a9.jpg", "thumb": "media/t_f3ac35f5a9.jpg", "video": false}, {"file": "media/69c1fabf65.jpg", "thumb": "media/t_69c1fabf65.jpg", "video": false}, {"file": "media/dc54209c9d.jpg", "thumb": "media/t_dc54209c9d.jpg", "video": false}, {"file": "media/293103d831.jpg", "thumb": "media/t_293103d831.jpg", "video": false}, {"file": "media/4ead6a4fb7.jpg", "thumb": "media/t_4ead6a4fb7.jpg", "video": false}, {"file": "media/ebb7a3295e.jpg", "thumb": "media/t_ebb7a3295e.jpg", "video": false}], "caption": "Grande nouvelle : du 1er au 6 décembre, je m'installe au Studio 42 ✨\n\nUn magasin éphémère en plein centre-ville de Mulhouse, à quelques mètres du marché de Noël.\n\nVous y trouverez mes vestes customisées, mes chemises et mes bijoux en cravate, tous des pièces uniques faites main.\n\nEt surtout : apportez votre veste, je la customise sur place, devant vous.\n\n📍 Studio 42, 1 rue Henriette, Mulhouse\n📅 Du mardi 1er au dimanche 6 décembre (ouvert aussi le dimanche après-midi)\n\nEnregistrez ce post pour ne pas oublier, et partagez-le à une amie qui cherche un cadeau original.\n\n#mulhouse #marchedenoelmulhouse #customisation #piecesunique #faitmain #ideecadeau #upcycling", "tip": "Dans Instagram, sélectionne les 6 images dans l'ordre, puis colle la légende."}]}, {"label": "Semaine du 30 nov.", "id": "s49", "items": [{"id": "r30", "day": "Lundi 30 nov.", "type": "Reel", "title": "Je customise votre veste", "media": [{"file": "media/59e6b26b50.mp4", "thumb": null, "video": true}], "caption": "POV : je customise votre veste ✂️\n\nBroderies, dentelle, petits détails… voilà à quoi ressemblent mes journées derrière ma machine 🧵\n\nEt cette semaine, c'est vous qui choisissez ! Du 1er au 6 décembre, je suis au Studio 42, 1 rue Henriette à Mulhouse : apportez votre veste, je la customise sur place 🥰\n\n#customchic #cecilethouvenin #customisation #creationunique #secondemain #vesteunique #faitmain #alsace #hautrhin #mulhouse #studio42 #coulisses", "tip": "Ajoute une musique de ton choix au moment de publier.", "cover": "/home/claude/cecile/up/r07_cover.jpg", "poster": "media/t_35fb7b76ae.jpg"}, {"id": "st30", "day": "Lundi 30 nov.", "type": "Story", "title": "C'est demain !", "media": [{"file": "media/e08e24e563.jpg", "thumb": "media/t_e08e24e563.jpg", "video": false}], "caption": "", "tip": "Ajoute un sticker « compte à rebours » (mardi 1er décembre) en haut de la story."}, {"id": "st01", "day": "Du mardi 1er au samedi 5", "type": "Story", "title": "En ce moment au Studio 42", "media": [{"file": "media/7964f88dc3.jpg", "thumb": "media/t_7964f88dc3.jpg", "video": false}], "caption": "", "tip": "À remettre chaque matin, avec le sticker « lieu : Mulhouse ». Et si tu peux, une petite photo de ton stand en plus !"}, {"id": "st06", "day": "Dimanche 6 déc.", "type": "Story", "title": "Dernier jour", "media": [{"file": "media/593e9f5cb1.jpg", "thumb": "media/t_593e9f5cb1.jpg", "video": false}], "caption": "", "tip": "Ajoute le sticker « lieu : Mulhouse »."}]}], "colors": {"main": "#1f2a44", "accent": "#e8879a", "bg": "#f7f0e5"}, "contact": "Clémence"};
const $ = s => document.querySelector(s);
const C = DATA.colors || {}; for (const k in C) document.documentElement.style.setProperty('--' + k, C[k]);
const KEY = 'pap_' + DATA.client;
let done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const files = {};
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600); }
$('#h1').textContent = DATA.client; $('#hello').textContent = DATA.hello;
$('#help').innerHTML = DATA.contact ? 'Une question ? Écris-moi sur WhatsApp, je t\'explique 😊' : '';
const all = DATA.weeks.flatMap(w => w.items.map(i => i.id));
function progress() { const n = all.filter(id => done[id]).length; $('#count').textContent = n + ' / ' + all.length + ' publiés'; $('#barfill').style.width = (100 * n / all.length) + '%'; }
async function preload(it) {
  if (files[it.id]) return files[it.id];
  files[it.id] = Promise.all(it.media.map(async (m, k) => { const r = await fetch(m.file); const b = await r.blob(); const ext = m.file.split('.').pop(); return new File([b], `${it.id}-${k + 1}.${ext}`, { type: b.type }); }));
  return files[it.id];
}
async function copyCap(it, btn) {
  try { await navigator.clipboard.writeText(it.caption); btn.classList.add('ok'); btn.querySelector('.t').textContent = 'Légende copiée ✓'; toast('Légende copiée, tu pourras la coller dans Instagram'); }
  catch (e) { toast('Appuie longuement sur la légende pour la copier'); }
}
async function share(it) {
  const fl = await files[it.id];
  if (fl && navigator.canShare && navigator.canShare({ files: fl })) {
    try { await navigator.share({ files: fl }); } catch (e) { if (e.name !== 'AbortError') $('#sheet').classList.add('show'); }
  } else { $('#sheet').classList.add('show'); }
}
function render(wid) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.id === wid));
  const w = DATA.weeks.find(x => x.id === wid); const L = $('#list'); L.innerHTML = '';
  w.items.forEach(it => {
    preload(it);
    const c = document.createElement('section'); c.className = 'card' + (done[it.id] ? ' done' : '');
    const story = it.type.toLowerCase().includes('story');
    const media = it.media.map(m => m.video ? `<video src="${m.file}" ${it.poster ? `poster="${it.poster}"` : ''} controls playsinline preload="none"></video>` : `<img src="${m.file}" alt="" loading="lazy">`).join('');
    c.innerHTML = `
      <div class="top"><span class="day">${it.day}</span><span class="type ${story ? 'story' : ''}">${it.type}</span></div>
      <div class="title">${it.title}</div>
      <div class="media ${it.media.length === 1 ? 'one' : ''}">${media}</div>
      ${it.media.length > 1 ? `<div class="swipe">← Fais glisser pour voir les ${it.media.length} images</div>` : ''}
      ${it.tip ? `<div class="tip">💡 ${it.tip}</div>` : ''}
      ${it.caption ? `<div class="cap">${it.caption.replace(/</g, '&lt;')}</div>` : ''}
      <div class="steps">
        ${it.caption ? `<button class="btn alt cp"><span class="n">1</span><span class="t">Copier la légende</span></button>` : ''}
        <button class="btn sh"><span class="n">${it.caption ? 2 : 1}</span><span class="t">${it.media.length > 1 ? 'Envoyer les ' + it.media.length + ' images vers Instagram' : (it.media[0].video ? 'Envoyer la vidéo vers Instagram' : "Envoyer l'image vers Instagram")}</span></button>
      </div>
      <label class="check"><input type="checkbox" ${done[it.id] ? 'checked' : ''}> C'est publié !</label>`;
    const cap = c.querySelector('.cap'); if (cap) cap.onclick = () => cap.classList.toggle('open');
    const cp = c.querySelector('.cp'); if (cp) cp.onclick = () => copyCap(it, cp);
    c.querySelector('.sh').onclick = () => share(it);
    c.querySelector('input').onchange = e => { done[it.id] = e.target.checked; save(); c.classList.toggle('done', e.target.checked); progress(); if (e.target.checked) toast('Bravo ! 🎉'); };
    L.appendChild(c);
  });
}
DATA.weeks.forEach(w => { const b = document.createElement('button'); b.textContent = w.label; b.dataset.id = w.id; b.onclick = () => { render(w.id); try { localStorage.setItem(KEY + '_w', w.id); } catch (e) {} }; $('#tabs').appendChild(b); });
let start = DATA.weeks[0].id; try { start = localStorage.getItem(KEY + '_w') || start; } catch (e) {}
if (!DATA.weeks.find(w => w.id === start)) start = DATA.weeks[0].id;
render(start); progress();
</script>
</body>
</html>
